    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,400&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
    
    <!-- GOOGLE ANALYTICS 4 (GA4) -->
    <script>
      const GA_MEASUREMENT_ID = 'G-7QMVYD805R';
      const ADS_CONVERSION_ID = 'AW-XXXXXXXXX'; // Substitua pelo ID real do Google Ads
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}

      function applyConsentDefaults() {
        gtag('consent', 'default', {
          ad_storage: 'denied',
          analytics_storage: 'denied',
          ad_user_data: 'denied',
          ad_personalization: 'denied'
        });
      }

      function injectGtagScript(id) {
        if (!id || id.includes('XXXX')) {
          return;
        }
        if (document.querySelector(`script[data-gtag-id="${id}"]`)) {
          return;
        }
        const tagScript = document.createElement('script');
        tagScript.async = true;
        tagScript.src = `https://www.googletagmanager.com/gtag/js?id=${id}`;
        tagScript.dataset.gtagId = id;
        document.head.appendChild(tagScript);
      }

      function enableMeasurement() {
        if (GA_MEASUREMENT_ID && !GA_MEASUREMENT_ID.includes('XXXX')) {
          injectGtagScript(GA_MEASUREMENT_ID);
          gtag('js', new Date());
          gtag('config', GA_MEASUREMENT_ID);
        }
        if (ADS_CONVERSION_ID && !ADS_CONVERSION_ID.includes('XXXX')) {
          injectGtagScript(ADS_CONVERSION_ID);
          gtag('config', ADS_CONVERSION_ID);
        }
      }

      applyConsentDefaults();

      window.__vidareConsent = {
        update(status) {
          const granted = status === 'granted';
          gtag('consent', 'update', {
            ad_storage: granted ? 'granted' : 'denied',
            analytics_storage: granted ? 'granted' : 'denied',
            ad_user_data: granted ? 'granted' : 'denied',
            ad_personalization: granted ? 'granted' : 'denied'
          });
          if (granted) {
            enableMeasurement();
          }
        }
      };
    </script>
  </head>
  <body>
